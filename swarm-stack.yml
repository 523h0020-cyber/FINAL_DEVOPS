version: '3.8'

services:
  app:
    image: ${DOCKER_IMAGE:-giang/final-tier4-app}:${APP_VERSION:-v1.0.1}
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/final-app
      - PORT=3000
    networks:
      - traefik-public
      - backend
      - monitoring  # FIX: Thêm vào network monitoring để Prometheus scrape được metrics
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first  # Zero-downtime rolling update
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        # FIX: Dùng biến ${DOMAIN_NAME} thay vì hardcode domain
        - "traefik.http.routers.app.rule=Host(`${DOMAIN_NAME}`)"
        - "traefik.http.routers.app.entrypoints=websecure"
        # FIX: Đồng bộ certresolver với Traefik config (dùng 'le' thay vì 'myresolver')
        - "traefik.http.routers.app.tls.certresolver=le"
        - "traefik.http.services.app.loadbalancer.server.port=3000"

  mongodb:
    image: mongo:7.0.4
    volumes:
      - mongo-data:/data/db
    networks:
      - backend
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

networks:
  traefik-public:
    external: true
  backend:
    driver: overlay
  monitoring:
    external: true  # Dùng network overlay đã tạo bởi monitoring stack

volumes:
  mongo-data:
