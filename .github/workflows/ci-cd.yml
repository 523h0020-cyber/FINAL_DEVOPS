name: production-ci-cd

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_DIR: "app"
  PACKAGE_MANAGER: "npm" # npm | maven | pip
  ORCHESTRATOR: "swarm" # swarm | kubernetes
  DOCKER_IMAGE: "${{ secrets.DOCKERHUB_USERNAME }}/final-tier4-app"

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js with npm cache
        if: env.PACKAGE_MANAGER == 'npm'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "${{ env.APP_DIR }}/package-lock.json"

      - name: Setup Java with Maven cache
        if: env.PACKAGE_MANAGER == 'maven'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Setup Python with pip cache
        if: env.PACKAGE_MANAGER == 'pip'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "${{ env.APP_DIR }}/requirements*.txt"

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          case "${PACKAGE_MANAGER}" in
            npm)
              npm ci
              ;;
            maven)
              mvn -B -ntp dependency:go-offline
              ;;
            pip)
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              ;;
            *)
              echo "Unsupported PACKAGE_MANAGER=${PACKAGE_MANAGER}" >&2
              exit 1
              ;;
          esac

      - name: Run linting
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          case "${PACKAGE_MANAGER}" in
            npm)
              npm run lint --if-present
              ;;
            maven)
              mvn -B -ntp -DskipTests verify
              ;;
            pip)
              python -m pip install flake8
              flake8 .
              ;;
            *)
              echo "Unsupported PACKAGE_MANAGER=${PACKAGE_MANAGER}" >&2
              exit 1
              ;;
          esac

      - name: Trivy filesystem scan (fail on High/Critical)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: "${{ env.APP_DIR }}"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"

  build_and_push:
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      deploy_image: ${{ steps.meta.outputs.deploy_image }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build image locally for security scan
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            -t "${DOCKER_IMAGE}:scan-${GITHUB_SHA}" \
            "${APP_DIR}"

      - name: Trivy image scan (fail on High/Critical)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: "${{ env.DOCKER_IMAGE }}:scan-${{ github.sha }}"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"

      - name: Prepare semantic tags
        id: prep_tags
        shell: bash
        run: |
          set -euo pipefail
          SHA_TAG="sha-${GITHUB_SHA::7}"
          SEMVER_TAG="v1.0.${GITHUB_RUN_NUMBER}"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "semver_tag=${SEMVER_TAG}" >> "$GITHUB_OUTPUT"

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push semantic tags (no latest)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.prep_tags.outputs.sha_tag }}
            ${{ env.DOCKER_IMAGE }}:${{ steps.prep_tags.outputs.semver_tag }}

      - name: Push git-tag semver when release tag is present
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="${GITHUB_REF_NAME}"
          docker pull "${DOCKER_IMAGE}:${{ steps.prep_tags.outputs.sha_tag }}"
          docker tag "${DOCKER_IMAGE}:${{ steps.prep_tags.outputs.sha_tag }}" "${DOCKER_IMAGE}:${RELEASE_TAG}"
          docker push "${DOCKER_IMAGE}:${RELEASE_TAG}"

      - name: Export deploy image tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          echo "deploy_image=${DOCKER_IMAGE}:${{ steps.prep_tags.outputs.semver_tag }}" >> "$GITHUB_OUTPUT"

  cd:
    runs-on: ubuntu-latest
    needs: build_and_push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Docker Swarm via SSH
        if: env.ORCHESTRATOR == 'swarm'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SWARM_MANAGER_HOST }}
          username: ${{ secrets.SWARM_MANAGER_USER }}
          key: ${{ secrets.SWARM_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}"
            docker pull "${{ needs.build_and_push.outputs.deploy_image }}"
            docker service update \
              --with-registry-auth \
              --image "${{ needs.build_and_push.outputs.deploy_image }}" \
              "${{ secrets.SWARM_SERVICE_NAME }}"

      - name: Setup kubectl
        if: env.ORCHESTRATOR == 'kubernetes'
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        if: env.ORCHESTRATOR == 'kubernetes'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"

      - name: Deploy to Kubernetes
        if: env.ORCHESTRATOR == 'kubernetes'
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n "${{ secrets.K8S_NAMESPACE }}" set image deployment/"${{ secrets.K8S_DEPLOYMENT_NAME }}" \
            "${{ secrets.K8S_CONTAINER_NAME }}=${{ needs.build_and_push.outputs.deploy_image }}"
          kubectl -n "${{ secrets.K8S_NAMESPACE }}" rollout status deployment/"${{ secrets.K8S_DEPLOYMENT_NAME }}" --timeout=180s
